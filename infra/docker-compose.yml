services:
  postgres:
    image: postgres:16-alpine
    container_name: nirova-postgres
    environment:
      POSTGRES_USER: nirova
      POSTGRES_PASSWORD: nirova
      POSTGRES_DB: nirova_control
    ports:
      - "5432:5432"
    volumes:
      - nirova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirova -d nirova_control"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nirova-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nirova_pgdata:
