[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
testpaths = tests
# -r fE reports failures and errors with reasons; --tb=short keeps a failing
# seed's traceback readable without burying the assertion line that matters.
addopts = -r fE --tb=short --strict-markers
markers =
    seeds: drives the demo seeds against a live tenant database; slow.
